    <meta property="og:title" content="شات عربي - محادثات جماعية وخاصة ولوحة تحكم المشرفين" />
    <meta property="og:description" content="منصة شات عربي للدردشة الجماعية والخاصة ومشاركة الصور مع لوحة تحكم متقدمة للمشرفين وإدارة الصلاحيات." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      // Ensure trailing slash on GitHub Pages so relative paths always resolve properly
      (function() {
        if (window.location.hostname.includes('github.io')) {
          var p = window.location.pathname;
          if (p === '/Bekalte-stor' || (p.indexOf('/Bekalte-stor') === 0 && !p.endsWith('/') && !p.includes('.'))) {
            window.location.replace(p + '/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-['Cairo',system-ui,sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback for static servers (e.g. GitHub Pages serving from main branch)
      if (window.location.hostname.includes('github.io')) {
        var s = document.createElement('script');
        s.type = 'module';
        s.crossOrigin = 'anonymous';
        s.src = './assets/app.js';
        document.body.appendChild(s);

        var c = document.createElement('link');
        c.rel = 'stylesheet';
        c.crossOrigin = 'anonymous';
        c.href = './assets/index.css';
        document.head.appendChild(c);
      }
    </script>
  </body>
</html>
