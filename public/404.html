<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>شات عربي - جاري التحويل</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Mitigates 404 errors by redirecting back to the index with the path
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #0b0f17; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h2>جاري توجيهك إلى شات عربي...</h2>
    <p><a href="./" style="color: #10b981;">انقر هنا إذا لم يتم تحويلك تلقائياً</a></p>
  </body>
</html>
